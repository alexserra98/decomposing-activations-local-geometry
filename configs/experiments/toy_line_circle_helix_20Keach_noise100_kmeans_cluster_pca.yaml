# Full HDDC pipeline: training, responsibility assignments, and toy evaluation.
# One line (segment), circle, and helix: 20,000 noiseless points each in D=128.
# Fit K=300 and 16 local PCA directions on the 54,000 training rows only.

experiment:
  name: toy_line_circle_helix_20Keach_kmeans_cluster_pca
  output_root: dalg-cache/toy_manifold_models_line_circle_helix_20Keach_noise_sweep_seed0/noise_ratio_100

dataset:
  id: toy_line_circle_helix_D128_20Keach_noise100
  shard_dir: dalg-cache/assets/toy_manifolds_line_circle_helix_D128_20Keach_noise_sweep_seed0/noise_ratio_100
  layer: 0

model:
  kind: kmeans
  K: 1000
  surgery_threshold: 0.05

training:
  training_mode: single_process
  val_frac: 0.1
  split_seed: 42
  seed: 42
  device: cuda

assignments:
  enabled: true
  batch_size: 4096
  device: cuda

evaluation:
  enabled: true
  kind: toy_manifold_tiling
  batch_size: 4096
  device: cuda

resources:
  partition: H100
  account: LADE
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 8
  gpus: 1
  gpu_type: H100
  memory: 80G
  time: "01:00:00"

sweep:
  model.surgery_threshold: [0.005, 0.05, 0.1, 0.25, 0.5, 1.0]
  model.K: [50, 100, 300, 500]

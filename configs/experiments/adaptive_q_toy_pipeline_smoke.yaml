# Small end-to-end smoke run: train -> assignments -> adaptive-q evaluation.
# The source toy-manifold activation shards must already exist.

experiment:
  name: adaptive_q_toy_pipeline_smoke
  output_root: dalg-cache/toy_manifold_models/experiments

dataset:
  id: toy_manifolds_D128_150K
  shard_dir: dalg-cache/assets/toy_manifolds_8types_2each_D128_150K_shards
  layer: 0

model:
  kind: hddc
  K: 16
  q_max: 4
  isotropic_psi: true
  surgery_every_epochs: 0

training:
  # Reuse one initialization across runs by pointing at a compatible (K, D)
  # .pt tensor file.
  # centroids_path: dalg-cache/toy_manifold_models/centroids/k16_D128/centroids.pt
  epochs: 1
  # Smoke-only hard cap; omit this for normal epoch-limited training.
  max_steps: 4
  epoch_snapshot_every: 0
  batch_size: 2048
  num_workers: 2
  pool_size: 4096
  refine_epochs: 0
  val_frac: 0.1
  split_seed: 42
  seed: 42
  device: cuda
  wandb: false

assignments:
  enabled: true
  batch_size: 4096
  device: cuda

evaluation:
  enabled: true
  kind: adaptive_q_toy
  batch_size: 4096
  device: cuda

resources:
  partition: H100
  account: LADE
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 8
  gpus: 1
  gpu_type: H100
  memory: 80G
  time: "01:00:00"
  max_parallel: 1

# Focused initialization comparison using local KMeans principal components.
# The centroid bundle stores 16 PCs per component, matching q_max=16.

experiment:
  name: adaptive_q_toy_30k_hddc_shared_b_active_set_cluster_pca_sweep
  output_root: dalg-cache/toy_manifold_models_30k/

dataset:
  id: toy_manifolds_D128_30K_noise1e4
  shard_dir: /orfeo/cephfs/home/dssc/zenocosini/decomposing-activations-local-geometry/dalg-cache/assets/toy_manifolds_circle_helix_torus_D128_30K_noise1e4_shards
  layer: 0

model:
  kind: hddc
  K: 300
  q_max: 16
  shared_b: true
  surgery_every_epochs: 0.5
  surgery_threshold: 0.1
  surgery_min_count: 20

training:
  centroids_path: /u/dssc/zenocosini/decomposing-activations-local-geometry/dalg-cache/toy_manifold_models_30k/centroids/kmeans_k300/centroids.pt
  direction_init: cluster_pca
  epochs: 1000
  early_stop_patience: 10
  early_stop_min_delta: 0.001
  early_stop_delta: 0.0
  epoch_snapshot_every: 1
  batch_size: 2048
  num_workers: 2
  pool_size: 4096
  refine_epochs: 0
  val_frac: 0.1
  split_seed: 42
  seed: 42
  device: cuda
  wandb: false

assignments:
  enabled: true
  batch_size: 4096
  device: cuda

evaluation:
  enabled: true
  kind: toy_manifold_tiling
  batch_size: 4096
  device: cuda

resources:
  partition: H100
  account: LADE
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 8
  gpus: 1
  gpu_type: H100
  memory: 80G
  time: "01:00:00"
  max_parallel: 1

sweep:
  model.surgery_threshold: [0.1, 0.2, 0.3, 0.4]

# Four-point HDDC surgery-threshold sweep with KMeans cluster-PCA initialization.

experiment:
  name: adaptive_q_toy_20k_hddc_cluster_pca_threshold_sweep
  output_root: /orfeo/cephfs/scratch/dssc/zenocosini/dalg-cache/toy_manifold_models_20k

dataset:
  id: toy_manifolds_D128_20K_noise1e4
  shard_dir: /orfeo/cephfs/scratch/dssc/zenocosini/dalg-cache/assets/toy_manifolds_circle_helix_D128_20K_noise1e4_shards
  layer: 0

model:
  kind: hddc
  K: 200
  q_max: 16
  isotropic_psi: true
  surgery_every_epochs: 1
  surgery_threshold: 0.001

training:
  centroids_path: /orfeo/cephfs/scratch/dssc/zenocosini/dalg-cache/toy_manifold_models_20k/centroids/kmeans_k200/centroids.pt
  direction_init: cluster_pca
  epochs: 500
  early_stop_patience: 10
  early_stop_min_delta: 0.001
  early_stop_delta: 0.0
  epoch_snapshot_every: 1
  batch_size: 2048
  num_workers: 2
  pool_size: 4096
  refine_epochs: 0
  val_frac: 0.1
  split_seed: 42
  seed: 42
  device: cuda
  wandb: false

assignments:
  enabled: true
  batch_size: 4096
  device: cuda

evaluation:
  enabled: true
  kind: toy_manifold_tiling
  batch_size: 4096
  device: cuda

resources:
  partition: H100
  account: LADE
  nodes: 1
  ntasks_per_node: 1
  cpus_per_task: 8
  gpus: 1
  gpu_type: H100
  memory: 80G
  time: "01:00:00"
  max_parallel: 4

sweep:
  model.surgery_threshold: [0.0001, 0.001, 0.01, 0.1]

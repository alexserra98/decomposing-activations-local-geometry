[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "decomposing-activations-local-geometry"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dadapy",
    "datasets>=4.8.4",
    "dotenv>=0.9.9",
    "huggingface-hub>=1.5.0,<2.0",
    "ipykernel>=7.2.0",
    "jax[cuda12]>=0.10.2",
    "nbconvert>=7.17.1",
    "openai>=2.33.0",
    "pandas>=3.0.2",
    "plotly>=6.8.0",
    "pyyaml>=6.0",
    "pytest>=9.1.1",
    "scikit-learn>=1.9.0",
    "scikit-learn-extra>=0.3.0",
    "scipy>=1.17.1",
    "streamlit>=1.45.0",
    "umap-learn>=0.5.12",
    "wandb>=0.17",
]

[project.scripts]
dalg-run-extraction = "dalg.cli.run_extraction:main"
dalg-run-metrics = "dalg.cli.run_metrics:main"
dalg-run-training = "dalg.cli.run_training:main"
dalg-run-training-ard = "dalg.cli.adaptive_q.run_training_ard:main"
dalg-run-training-hddc = "dalg.cli.adaptive_q.run_training_hddc:main"
dalg-run-pipeline = "dalg.cli.run_pipeline:main"
dalg-interpret-mfa = "dalg.cli.interpret_mfa:main"
dalg-label-mfa-clusters = "dalg.cli.label_mfa_clusters:main"
dalg-gaussian-overlap = "dalg.analysis.gaussian_overlap:main"
dalg-cluster-intrinsic-dim = "dalg.analysis.cluster_intrinsic_dim:main"
dalg-build-pile-windows = "dalg.data.build_pile_windows:main"
dalg-build-newsgroups-windows = "dalg.data.build_newsgroups_windows:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
dadapy = { git = "https://github.com/sissa-data-science/DADApy" }
